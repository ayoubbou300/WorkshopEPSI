name: sentinel-x

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Aucun port publié : la base n'est joignable que depuis le réseau interne.
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      MQTT_DEVICE_ID: ${MQTT_DEVICE_ID}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD}
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD}
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
      - ./infra/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    ports:
      # Seul le listener TLS est publié pour l'ESP8266.
      - "${MQTTS_PORT:-8883}:8883"
    networks: [backend]
    healthcheck:
      # Port 1883 (0x075B) en écoute ; BusyBox nc ne propose pas -z.
      test: ["CMD-SHELL", "grep -Eq ':075B [0-9A-F]+:0000 0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      ALERTS_API_KEY: ${ALERTS_API_KEY}
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "true"
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-10}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-15}
      VIDEO_STREAM_URL: ${VIDEO_STREAM_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    depends_on: [api]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Simulateur de mesures : docker compose --profile sim up simulator
  simulator:
    build: ./backend
    profiles: ["sim"]
    command: ["python", "/scripts/simulate.py"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: sim-01
      MQTT_PASSWORD: ${MQTT_SIM_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  # Tests automatisés : docker compose --profile test run --rm tests
  tests:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  mosquitto-data:

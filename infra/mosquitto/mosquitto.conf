# Réglages d'authentification propres à chaque listener (nécessaire pour le mode
# compatibilité, dont le listener accepte des clients anonymes).
per_listener_settings true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Limite la taille des messages acceptés (les mesures font quelques centaines d'octets).
max_packet_size 8192

# Listener interne au réseau Docker (backend, simulateur) : non publié sur l'hôte.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Listener TLS publié pour l'ESP8266.
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
tls_version tlsv1.2

# Listeners optionnels générés au démarrage (mode compatibilité, cf. entrypoint.sh).
include_dir /mosquitto/data/conf.d
